<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siam Journey Demo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c2d12">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-thai-silk font-sans">
  <div id="root" class="p-6"></div>

  <!-- React + ReactDOM CDN -->
  <script type="module">
    import React from "https://aistudiocdn.com/react@^19.2.0";
    import ReactDOM from "https://aistudiocdn.com/react-dom@^19.2.0";

    // 最簡單 App 元件
    const App = () => {
      return (
        <div class="text-center">
          <h1 class="text-3xl font-serif text-red-700 mb-4">Siam Journey</h1>
          <p class="text-lg">這是一個簡單的 PWA React 範例</p>
        </div>
      );
    };

    // Render 到 root
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

    // Service Worker 註冊
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('SW registered', reg))
          .catch(err => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
